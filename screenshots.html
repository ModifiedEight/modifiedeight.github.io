<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshots | ModifiedEight</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px 0;
        }
        .screenshot-item {
            cursor: pointer;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
            background-color: #222;
        }
        .screenshot-item:hover {
            transform: scale(1.03);
        }
        .screenshot-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            border-radius: 4px;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #bbb;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-inverse">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="index.html"><img src="ModifiedEight_logo.png" width="180px"></a>
            </div>
            <div class="collapse navbar-collapse" id="navbar-collapse">
                <ul class="nav navbar-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="releases.html">Releases</a></li>
                    <li><a href="docs.html">Documentation</a></li>
                    <li class="active"><a href="screenshots.html">Screenshots</a></li>
                    <li><a href="https://discord.gg/4fv4RrTav4">Discord</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1>Screenshots</h1>
        <div class="screenshot-grid">
            <div class="screenshot-item">
                <img src="images/server_test_2.png" onclick="openModal(this.src)">
            </div>
            <div class="screenshot-item">
                <img src="screenshots/IMG_0359.png" alt="by ArkQuark" onclick="openModal(this.src)">
            </div>
            <div class="screenshot-item">
                <img src="screenshots/screenshot1.png" alt="by mryoshiii" onclick="openModal(this.src)">
            </div>
            <div class="screenshot-item">
                <img src="screenshots/screenshot2.png" alt="" onclick="openModal(this.src)">
            </div>
            <div class="screenshot-item">
                <img src="screenshots/screenshot3.png" alt="" onclick="openModal(this.src)">
            </div>
             <div class="screenshot-item">
                <img src="screenshots/screenshot4.png" alt="" onclick="openModal(this.src)">
            </div>
            <div class="screenshot-item">
                <img src="screenshots/screenshot5.png" alt="" onclick="openModal(this.src)">
            </div>
        </div>
    </div>
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>
    <br><br><br>
    <iframe src="footer.html" style="width: 100%; height: 40px; border: none; overflow: hidden;"></iframe>
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script>
        function openModal(src) {
            document.getElementById('imageModal').style.display = 'block';
            document.getElementById('modalImage').src = src;
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
